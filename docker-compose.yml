name: cove

x-app-env: &app-env
  COVE_TIMEZONE: ${COVE_TIMEZONE:-Europe/Amsterdam}
  COVE_DATABASE_URL: postgresql://cove_app:${COVE_APP_PASSWORD}@postgres:5432/cove
  COVE_READONLY_URL: postgresql://cove_readonly:${COVE_READONLY_PASSWORD}@postgres:5432/cove

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      POSTGRES_USER: cove_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cove
      COVE_APP_PASSWORD: ${COVE_APP_PASSWORD}
      COVE_READONLY_PASSWORD: ${COVE_READONLY_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove_owner -d cove"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: amacneil/dbmate:2@sha256:b0c8a87bfef4f2819fdb0a68ca357a44d12fb90d23eca695fcfc3b7e159cb1c5
    environment:
      DATABASE_URL: postgresql://cove_owner:${POSTGRES_PASSWORD}@postgres:5432/cove?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db:ro
    command: ["--wait", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: cove-app:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      COVE_MCP_URLS: ${COVE_MCP_URLS:-http://127.0.0.1:8765/mcp}
    command: ["uvicorn", "cove.web.app:app", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - notes_blobs:/data/blobs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    image: cove-app:latest
    restart: unless-stopped
    command: ["python", "-m", "cove.mcp_server"]
    volumes:
      - notes_blobs:/data/blobs
    environment:
      <<: *app-env
      COVE_MCP_EXTRA_HOSTS: ${COVE_MCP_EXTRA_HOSTS:-}
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_started   # ensures the shared image is built first

  backup:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: cove_owner
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: cove
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./db/backup.sh:/backup.sh:ro
      - notes_blobs:/blobs:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Test runner: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    image: cove-app:latest
    environment:
      COVE_TEST_DATABASE_URL: postgresql://cove_owner:${POSTGRES_PASSWORD}@postgres:5432/cove_test
    volumes:
      - ./app/tests:/srv/app/tests:ro
      - ./db:/srv/db:ro
    working_dir: /srv/app
    command: ["pytest", "-q", "-p", "no:cacheprovider", "tests"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  notes_blobs:
