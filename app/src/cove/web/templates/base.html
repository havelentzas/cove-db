<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}cove{% endblock %} · cove</title>
<script src="/static/htmx.min.js"></script>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e3e2dd;--accent:#2f6f5e;--accent-ink:#fff;--warn:#a5521c;--err-bg:#fdecea;--err:#8a1c12;--chip:#eef2ef}
@media (prefers-color-scheme:dark){:root{--bg:#141513;--panel:#1d1e1b;--ink:#e9e8e3;--muted:#9a9992;--line:#2f302c;--accent:#7cc3ad;--accent-ink:#0d1a16;--warn:#e0a46e;--err-bg:#3a1714;--err:#ffb4a9;--chip:#263029}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .brand{font-weight:700;font-size:18px;text-decoration:none;color:var(--ink)}
header nav{display:flex;gap:14px;flex-wrap:wrap}
header nav a{text-decoration:none;color:var(--muted)}
header nav a:hover{color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;margin:1px 2px 1px 0;text-decoration:none;color:var(--ink)}
.chip.group{outline:1px solid var(--accent)}
.btn,button{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn.secondary,button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.link{background:none;color:var(--muted);padding:0;font-size:13px;text-decoration:underline}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
textarea{min-height:70px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.table-wrap{overflow-x:auto}
.due{color:var(--warn);font-weight:600}
.errors{background:var(--err-bg);color:var(--err);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 140px}
.row>.shrink{flex:0 0 auto}
.flash{background:var(--chip);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.timeline li{margin-bottom:10px}
ul.plain{list-style:none;padding:0;margin:0}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
dt{color:var(--muted);font-size:13px}
dd{margin:0;white-space:pre-wrap}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--chip)}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">cove</a>
  <nav><a href="/">Contacts</a><a href="/?due=1">Due</a><a href="/tags">Tags &amp; groups</a><a href="/import">Import</a><a href="/export.vcf">Export</a></nav>
  <span style="flex:1"></span>
  <a class="btn" href="/contacts/new">+ New contact</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
