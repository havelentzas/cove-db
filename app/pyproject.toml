[project]
name = "cove"
version = "0.1.0"
description = "cove-db: personal life databases behind an MCP server and web UI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "psycopg[binary,pool]>=3.2",
    "mcp>=1.9",
    "jsonschema>=4.23",
    "vobject>=0.9.8",
    "pytest>=8.3",
    "tzdata>=2025.1",
    "merge3>=0.0.15",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "nh3>=0.2.17",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cove"]

[tool.pytest.ini_options]
pythonpath = ["src"]
